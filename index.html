<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StarFlix – Star Wars Streaming</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Impact&display=swap" rel="stylesheet">

  <style>
    /* Your full CSS from before – paste it here if needed, or keep as-is */
    :root {
      --bg: #141414;
      --text: #ffffff;
      --muted: #b3b3b3;
      --netflix-red: #E50914;
      --gold: #ffd700;
      --transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    /* ... rest of your CSS remains the same ... */
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="nav-content">
      <div style="display:flex; align-items:center;">
        <div class="logo">STAR<span>FLIX</span></div>
        <div class="nav-links">
          <a href="#" class="active">Home</a>
          <a href="#">Series</a>
          <a href="#">Movies</a>
          <a href="#">New</a>
          <a href="#">My List</a>
        </div>
      </div>

      <div class="nav-right">
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search...">
        </div>
        <span style="font-size:1.4rem; cursor:pointer;">🔔</span>
        <!-- Changed creepy dude to Mandalorian helmet -->
        <div style="width:36px;height:36px;border-radius:4px;overflow:hidden;border:2px solid white;">
          <img src="https://images.unsplash.com/photo-1581833971385-983855972e47?auto=format&fit=crop&q=80&w=100&h=100" alt="Mandalorian Profile" style="width:100%;height:100%;object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero remains the same -->

  <section class="content-section">
    <h2 class="section-title">Continue Watching</h2>
    <div class="row-container">
      <button class="arrow arrow-left" onclick="scrollSlider(this, -1)">‹</button>
      <div class="slider">
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/3/3f/The_Mandalorian_season_3_poster.jpg" alt="The Mandalorian">
          <div class="card-overlay"><div>The Mandalorian S3</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/90/Ahsoka_black_background.svg" alt="Ahsoka">
          <div class="card-overlay"><div>Ahsoka</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Logo_of_Star_Wars_series_Andor.svg" alt="Andor">
          <div class="card-overlay"><div>Andor</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Obi_Wan_Kenobi_series_logo_simplified.svg" alt="Obi-Wan Kenobi">
          <div class="card-overlay"><div>Obi-Wan Kenobi</div></div>
        </div>
        <!-- Updated Clone Wars to working season 7 poster -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/c/c0/Star_Wars_The_Clone_Wars_Season_7.jpg" alt="Clone Wars">
          <div class="card-overlay"><div>Clone Wars</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Logo_Star_Wars_Rebels_schwarz.svg" alt="Rebels">
          <div class="card-overlay"><div>Rebels</div></div>
        </div>
      </div>
      <button class="arrow arrow-right" onclick="scrollSlider(this, 1)">›</button>
    </div>
  </section>

  <section class="content-section">
    <h2 class="section-title">Star Wars Movies</h2>
    <div class="row-container">
      <button class="arrow arrow-left" onclick="scrollSlider(this, -1)">‹</button>
      <div class="slider">
        <!-- Fixed A New Hope (was already good) -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/8/87/StarWarsMoviePoster1977.jpg" alt="A New Hope">
          <div class="card-overlay"><div>A New Hope</div></div>
        </div>
        <!-- Fixed Empire Strikes Back -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/3/3c/SW_-_Empire_Strikes_Back.jpg" alt="The Empire Strikes Back">
          <div class="card-overlay"><div>The Empire Strikes Back</div></div>
        </div>
        <!-- Fixed Return of the Jedi -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/Star_Wars_Return_of_the_Jedi.jpg" alt="Return of the Jedi">
          <div class="card-overlay"><div>Return of the Jedi</div></div>
        </div>
        <!-- Fixed Phantom Menace -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/Star_Wars_Episode_I_The_Phantom_Menace_poster.jpg" alt="The Phantom Menace">
          <div class="card-overlay"><div>The Phantom Menace</div></div>
        </div>
        <!-- Fixed Attack of the Clones -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/5/5e/Star_Wars_Episode_II_Attack_of_the_Clones_poster.jpg" alt="Attack of the Clones">
          <div class="card-overlay"><div>Attack of the Clones</div></div>
        </div>
        <!-- Revenge of the Sith (was already good) -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/9/93/Star_Wars_Episode_III_Revenge_of_the_Sith_poster.jpg" alt="Revenge of the Sith">
          <div class="card-overlay"><div>Revenge of the Sith</div></div>
        </div>
      </div>
      <button class="arrow arrow-right" onclick="scrollSlider(this, 1)">›</button>
    </div>
  </section>

  <!-- Footer and script remain the same -->

  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 80);
    });

    function scrollSlider(btn, direction) {
      const slider = btn.parentElement.querySelector('.slider');
      const scrollAmount = slider.clientWidth * 0.75 * direction;
      slider.scrollBy({ left: scrollAmount, behavior: 'smooth' });
    }
  </script>
</body>
</html>

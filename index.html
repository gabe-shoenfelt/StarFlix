<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StarFlix – Star Wars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Impact&display=swap" rel="stylesheet">
  <style>
    /* Paste your latest CSS here – the one I gave last time with --netflix-red: #E50914; */
    /* ... (keep all your :root, *, body, nav, hero, etc.) ... */
  </style>
</head>
<body>

  <!-- Navbar with fixed profile pic -->
  <nav id="navbar">
    <div class="nav-content">
      <div style="display:flex; align-items:center;">
        <div class="logo">STAR<span>FLIX</span></div>
        <div class="nav-links">
          <a href="#" class="active">Home</a>
          <a href="#">Series</a>
          <a href="#">Movies</a>
          <a href="#">New</a>
          <a href="#">My List</a>
        </div>
      </div>
      <div class="nav-right">
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search...">
        </div>
        <span style="font-size:1.4rem; cursor:pointer;">🔔</span>
        <div style="width:36px;height:36px;border-radius:4px;overflow:hidden;border:2px solid white;">
          <img src="https://images.unsplash.com/photo-1581833971385-983855972e47?auto=format&fit=crop&q=80&w=100&h=100" alt="Mandalorian" style="width:100%;height:100%;object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero -->

  <!-- Continue Watching row – fixed images -->
  <section class="content-section">
    <h2 class="section-title">Continue Watching</h2>
    <div class="row-container">
      <button class="arrow arrow-left" onclick="scrollSlider(this, -1)">‹</button>
      <div class="slider">
        <div class="card">
          <img src="https://static.wikia.nocookie.net/starwars/images/3/3f/The_Mandalorian_season_3_poster.jpg/revision/latest?cb=20230307000000" alt="Mandalorian S3">
          <div class="card-overlay"><div>The Mandalorian S3</div></div>
        </div>
        <!-- Ahsoka, Andor, Obi-Wan keep as-is or fallback if needed -->
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/90/Ahsoka_black_background.svg" alt="Ahsoka">
          <div class="card-overlay"><div>Ahsoka</div></div>
        </div>
        <!-- ... other cards ... -->
        <div class="card">
          <img src="https://static.wikia.nocookie.net/starwars/images/c/c0/Star_Wars_The_Clone_Wars_Season_7.jpg/revision/latest?cb=20200221000000" alt="Clone Wars">
          <div class="card-overlay"><div>Clone Wars</div></div>
        </div>
        <!-- Rebels keep SVG -->
      </div>
      <button class="arrow arrow-right" onclick="scrollSlider(this, 1)">›</button>
    </div>
  </section>

  <!-- Movies row – fixed posters -->
  <section class="content-section">
    <h2 class="section-title">Star Wars Movies</h2>
    <div class="row-container">
      <button class="arrow arrow-left" onclick="scrollSlider(this, -1)">‹</button>
      <div class="slider">
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/8/87/StarWarsMoviePoster1977.jpg" alt="A New Hope">
          <div class="card-overlay"><div>A New Hope</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/3/3c/SW_-_Empire_Strikes_Back.jpg" alt="Empire Strikes Back">
          <div class="card-overlay"><div>Empire Strikes Back</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/Star_Wars_Return_of_the_Jedi.jpg" alt="Return of the Jedi">
          <div class="card-overlay"><div>Return of the Jedi</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/Star_Wars_Episode_I_The_Phantom_Menace_poster.jpg" alt="Phantom Menace">
          <div class="card-overlay"><div>Phantom Menace</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/5/5e/Star_Wars_Episode_II_Attack_of_the_Clones_poster.jpg" alt="Attack of the Clones">
          <div class="card-overlay"><div>Attack of the Clones</div></div>
        </div>
        <div class="card">
          <img src="https://upload.wikimedia.org/wikipedia/en/9/93/Star_Wars_Episode_III_Revenge_of_the_Sith_poster.jpg" alt="Revenge of the Sith">
          <div class="card-overlay"><div>Revenge of the Sith</div></div>
        </div>
      </div>
      <button class="arrow arrow-right" onclick="scrollSlider(this, 1)">›</button>
    </div>
  </section>

  <!-- Footer + script -->

</body>
</html>
